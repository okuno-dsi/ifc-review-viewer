name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check publishable files
        run: npm run check:publish

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Build standalone viewer
        run: npm run build
